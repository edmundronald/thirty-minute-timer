<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30-minute timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500&family=Familjen+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEF2; --ink:#14202B; --muted:#5B6B79; --track:#CBD6DE; --arc:#0E8A8C; --alert:#D1315F; --btn:#14202B; --btnText:#E8EEF2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1A22; --ink:#E6EEF3; --muted:#8FA3B2; --track:#243542; --arc:#37C6C0; --alert:#FF6B93; --btn:#E6EEF3; --btnText:#0F1A22;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1A22; --ink:#E6EEF3; --muted:#8FA3B2; --track:#243542; --arc:#37C6C0; --alert:#FF6B93; --btn:#E6EEF3; --btnText:#0F1A22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 40px}
@media (display-mode:standalone){body{justify-content:center}}
.clock{text-align:center;background:var(--arc);border:2px solid var(--arc);color:#fff;border-radius:16px;padding:14px 34px 12px;transition:background .4s,border-color .4s}
.low .clock{background:var(--alert);border-color:var(--alert)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clock{color:#0F1A22}}
:root[data-theme="dark"] .clock{color:#0F1A22}
.clock .time{font-family:"Martian Mono",ui-monospace,Menlo,monospace;font-weight:300;font-size:clamp(34px,9vw,56px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .date{color:inherit;opacity:.88;font-size:15px;margin-top:2px}
.timer{position:relative;width:min(88vw,420px);aspect-ratio:1}
svg{width:100%;height:100%;display:block;overflow:visible}
.tick{stroke:var(--arc);stroke-width:3;stroke-linecap:round;transition:stroke .3s,opacity .3s}
.tick.gone{stroke:var(--track)}
.track{fill:none;stroke:var(--track);stroke-width:14}
.arc{fill:none;stroke:var(--arc);stroke-width:14;stroke-linecap:butt;transition:stroke .4s}
.arc2{fill:none;stroke:#17406B;stroke-width:14;stroke-linecap:butt}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .arc2{stroke:#8FB8FF}}
:root[data-theme="dark"] .arc2{stroke:#8FB8FF}
.low .arc{stroke:var(--alert)}
.redmark{stroke:#E5283B;stroke-width:4;stroke-linecap:round}
.stick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;transition:stroke .3s}
.stick.gone{stroke:var(--track)}
.lamp{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;width:28%;aspect-ratio:1;border-radius:50%;background:#000;border:3px solid var(--ink);transition:background .25s}
.lamp::after{content:"";position:absolute;left:50%;top:50%;width:16%;height:16%;border-radius:50%;background:#9E1B24;box-shadow:0 0 6px rgba(158,27,36,.45);transform:translate(-50%,-50%) scale(0);transition:transform .25s}
.lamp.on{background:#fff}
.lamp.on::after{transform:translate(-50%,-50%) scale(1)}
.sec{position:absolute;inset:0;pointer-events:none}
.sec::before{content:"";position:absolute;left:50%;top:0;width:3px;height:5%;margin-left:-1.5px;border-radius:1px;background:#000}
.num{font-family:"Martian Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:19px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.hand-line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.hand-hit{stroke:transparent;stroke-width:36;stroke-linecap:round}
#hand{cursor:grab;touch-action:none;outline:none}
#hand:active{cursor:grabbing}
.hand-head{fill:var(--ink);stroke:var(--bg);stroke-width:3}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.readout .left{font-family:"Martian Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:clamp(40px,12vw,72px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.readout .state{color:var(--muted);font-size:16px;margin-top:4px}
.low .readout .left{color:var(--alert)}
.controls{display:flex;gap:12px}
button{font:600 17px "Familjen Grotesk",system-ui,sans-serif;border-radius:999px;padding:14px 30px;cursor:pointer;border:2px solid var(--btn);background:var(--btn);color:var(--btnText);min-width:120px}
button.ghost{background:transparent;color:var(--ink)}
#go{background:#1F6FEB;border-color:#1F6FEB;color:#fff}
#go.stop{background:#D32F3C;border-color:#D32F3C}
#reset{background:#1E9E55;border-color:#1E9E55;color:#fff}
button:focus-visible{outline:3px solid var(--arc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="clock" aria-label="Current time">
  <div class="time" id="clock">--:--</div>
  <div class="date" id="date"></div>
</div>

<div class="timer" id="timer">
  <svg viewBox="0 0 320 320" role="img" aria-label="Countdown ring">
    <g id="ticks"></g>
    <circle class="track" cx="160" cy="160" r="118"/>
    <circle class="arc" id="arc" cx="160" cy="160" r="118" transform="rotate(-90 160 160)"/>
    <circle class="arc2" id="arc2" cx="160" cy="160" r="118" transform="rotate(-90 160 160)"/>
    <g id="marks"></g>
    <g id="hand"><line class="hand-hit" x1="160" y1="84" x2="160" y2="20"/><line class="hand-line" x1="160" y1="56" x2="160" y2="10"/></g>
  </svg>
  <div class="readout">
    <div class="lamp" id="lamp" role="button" aria-label="Start timer"><div class="sec" id="sec"></div></div>
  </div>
</div>

<div class="controls">
  <button id="go">Start</button>
  <button id="reset" class="ghost">Reset</button>
</div>

<script>
(function(){
  var TOTAL = 30*60*1000, C = 2*Math.PI*118;
  var arc = document.getElementById('arc'),
      lampEl = document.getElementById('lamp'), go = document.getElementById('go'),
      timer = document.getElementById('timer'), ticksG = document.getElementById('ticks');
  arc.style.strokeDasharray = C;
  var arc2 = document.getElementById('arc2');
  arc2.style.strokeDasharray = C; arc2.style.strokeDashoffset = C;
  var state = { set textContent(v){ var on = (v === 'Running'); lampEl.classList.toggle('on', on); go.classList.toggle('stop', on); lampEl.setAttribute('aria-label', on ? 'Stop timer' : 'Start timer'); } };

  var ns = 'http://www.w3.org/2000/svg', ticks = [];
  for (var i = 0; i < 30; i++){
    var a = (i/30)*2*Math.PI - Math.PI/2, major = i % 5 === 0;
    var r1 = major ? 136 : 140, r2 = 150;
    var l = document.createElementNS(ns,'line');
    l.setAttribute('x1',160+Math.cos(a)*r1); l.setAttribute('y1',160+Math.sin(a)*r1);
    l.setAttribute('x2',160+Math.cos(a)*r2); l.setAttribute('y2',160+Math.sin(a)*r2);
    l.setAttribute('class','tick'); ticksG.appendChild(l); ticks.push(l);
  }

  var small = [];
  for (var j = 0; j < 150; j++){
    if (j % 5 === 0) continue;
    var sa = (j/150)*2*Math.PI - Math.PI/2;
    var sl = document.createElementNS(ns,'line');
    sl.setAttribute('x1',160+Math.cos(sa)*144); sl.setAttribute('y1',160+Math.sin(sa)*144);
    sl.setAttribute('x2',160+Math.cos(sa)*150); sl.setAttribute('y2',160+Math.sin(sa)*150);
    sl.setAttribute('class','stick'); ticksG.appendChild(sl); small[j] = sl;
  }

  var numEls = [], numOff = 0;
  for (var n = 0; n <= 25; n += 5){
    var na = (n/30)*2*Math.PI - Math.PI/2;
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x',160+Math.cos(na)*86); tx.setAttribute('y',160+Math.sin(na)*86);
    tx.setAttribute('class','num'); tx.textContent = n; ticksG.appendChild(tx); numEls.push({el:tx, n:n});
  }

  var marksG = document.getElementById('marks'), hand = document.getElementById('hand'), sec = document.getElementById('sec');
  for (var k = 5; k < 30; k += 5){
    var ka = (k/30)*2*Math.PI - Math.PI/2;
    var rm = document.createElementNS(ns,'line');
    rm.setAttribute('x1',160+Math.cos(ka)*106); rm.setAttribute('y1',160+Math.sin(ka)*106);
    rm.setAttribute('x2',160+Math.cos(ka)*130); rm.setAttribute('y2',160+Math.sin(ka)*130);
    rm.setAttribute('class','redmark'); marksG.appendChild(rm);
  }

  var remaining = TOTAL, running = false, endAt = 0, raf = 0, finished = false;

  function pad(n){ return (n<10?'0':'')+n; }
  function render(){
    var lap2 = remaining > TOTAL, r1 = lap2 ? remaining - TOTAL : remaining, rt = lap2 ? TOTAL : remaining;
    arc.style.strokeDashoffset = lap2 ? 0 : C*(1 - remaining/TOTAL);
    arc2.style.strokeDashoffset = lap2 ? C*(1 - r1/TOTAL) : C;
    var off = lap2 ? 30 : 0;
    if (off !== numOff){ numOff = off; for (var q = 0; q < numEls.length; q++) numEls[q].el.textContent = numEls[q].n + off; }
    hand.setAttribute('transform','rotate('+(360*r1/TOTAL)+' 160 160)');
    sec.style.transform = 'rotate('+(360*((remaining % 60000)/60000))+'deg)';
    for (var i = 0; i < 30; i++) ticks[i].classList.toggle('gone', i*60000 > rt);
    for (var j = 0; j < 150; j++) if (small[j]) small[j].classList.toggle('gone', j*12000 > rt);
    var low = remaining <= 5*60*1000 && remaining > 0;
    timer.classList.toggle('low', low); document.body.classList.toggle('low', low);
  }
  function tick(){
    remaining = Math.max(0, endAt - Date.now());
    render();
    if (remaining <= 0){ done(); return; }
    raf = requestAnimationFrame(tick);
  }
  function done(){
    running = false; finished = true; state.textContent = 'Time’s up'; go.textContent = 'Start'; render();
  }
  function start(){
    if (finished || remaining <= 0){ remaining = TOTAL; finished = false; }
    running = true; endAt = Date.now() + remaining; state.textContent = 'Running'; go.textContent = 'Stop';
    cancelAnimationFrame(raf); tick();
  }
  function pause(){
    running = false; cancelAnimationFrame(raf); state.textContent = 'Paused'; go.textContent = 'Start';
  }
  function reset(){
    running = false; finished = false; cancelAnimationFrame(raf); remaining = TOTAL;
    state.textContent = 'Ready'; go.textContent = 'Start'; render();
  }
  go.addEventListener('click', function(){ running ? pause() : start(); });
  lampEl.addEventListener('click', function(){ go.click(); });

  // Drag the minute marker to set the remaining time
  function setRemaining(ms){
    remaining = Math.max(0, Math.min(2*TOTAL, ms));
    finished = false;
    if (running) endAt = Date.now() + remaining;
    render();
  }
  var svgEl = document.querySelector('svg'), dragging = false, cum = 360;
  function pointerAngle(e){
    var r = svgEl.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    var a = Math.atan2(dx, -dy) * 180/Math.PI;
    return a < 0 ? a + 360 : a;
  }
  hand.addEventListener('pointerdown', function(e){
    dragging = true; cum = 360*remaining/TOTAL;
    try{ hand.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  hand.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var a = pointerAngle(e);
    var cand = a + 360*Math.round((cum - a)/360);
    cum = Math.max(0, Math.min(720, cand));
    setRemaining(Math.round(cum/360*TOTAL/1000)*1000);
  });
  function endDrag(){ dragging = false; }
  hand.addEventListener('pointerup', endDrag);
  hand.addEventListener('pointercancel', endDrag);
  hand.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  document.getElementById('reset').addEventListener('click', reset);

  var clockEl = document.getElementById('clock'), dateEl = document.getElementById('date');
  function clock(){
    var d = new Date();
    clockEl.textContent = pad(d.getHours())+':'+pad(d.getMinutes());
    dateEl.textContent = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  }
  clock(); setInterval(clock, 250); render();
})();
</script>
</body>
</html>
